<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constrained Construction</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <div id="canvas-wrapper">
            <canvas id="game-canvas"></canvas>

            <div id="message-overlay" class="hidden">
                <h2 id="overlay-title">Success</h2>
                <p id="overlay-text">Structure held successfully!</p>
            </div>
        </div>
        <div id="ui-layer">
            <div id="hud">
                <h1>Constrained Construction</h1>
                <div class="status-panel">
                    <p>Mode: <span id="mode-text">BUILD</span></p>
                    <p>Budget: $<span id="budget-text">1000</span></p>
                </div>
                <div class="controls">
                    <button id="btn-simulate">Simulate</button>
                    <button id="btn-reset">Reset</button>

                    <div class="physics-settings">
                        <h3
                            style="font-size: 0.9rem; color: #64ffda; margin-bottom: 5px; border-bottom: 1px solid #3a4b66; padding-bottom: 3px; text-transform: uppercase;">
                            Global Physics</h3>
                        <div class="setting-item">
                            <label>Gravity: <span id="val-gravity">100%</span></label>
                            <input type="range" id="slider-gravity" min="0" max="2" step="0.01" value="1">
                        </div>
                        <div class="setting-item">
                            <label>Engine Iterations: <span id="val-iterations">50</span></label>
                            <input type="range" id="slider-iterations" min="10" max="100" step="1" value="50">
                        </div>
                        <div class="setting-item">
                            <label>Launch X Velocity: <span id="val-vel-x">0.0</span></label>
                            <input type="range" id="slider-vel-x" min="-100" max="100" step="1" value="0">
                        </div>
                        <div class="setting-item">
                            <label>Launch Y Velocity: <span id="val-vel-y">0.0</span></label>
                            <input type="range" id="slider-vel-y" min="-100" max="100" step="1" value="0">
                        </div>
                        <div class="setting-item" style="border-top: 1px solid #3a4b66; padding-top: 5px;">
                            <label>Live Velocity: <span id="live-velocity" style="color: #64ffda;">0.00</span></label>
                        </div>
                    </div>

                    <div class="physics-settings" style="margin-top: 10px;">
                        <h3
                            style="font-size: 0.9rem; color: #64ffda; margin-bottom: 5px; border-bottom: 1px solid #3a4b66; padding-bottom: 3px; text-transform: uppercase;">
                            Sandbox Rope Properties</h3>

                        <div class="setting-item">
                            <label>Breaking Strength: <span id="val-sandbox-strength">75%</span></label>
                            <input type="range" id="slider-sandbox-strength" min="0.5" max="6.5" step="0.05"
                                value="4.5">
                        </div>

                        <div class="setting-item">
                            <label>Starting Sag: <span id="val-sandbox-tension">100%</span></label>
                            <input type="range" id="slider-sandbox-tension" min="0.94" max="1.15" step="0.01"
                                value="1.0">
                        </div>

                        <div class="setting-item">
                            <label>Impact Rigidity: <span id="val-sandbox-rigidity">50</span></label>
                            <input type="range" id="slider-sandbox-rigidity" min="0" max="500" step="1" value="50">
                        </div>

                        <div class="setting-item">
                            <label>Segment Length: <span id="val-sandbox-segment">30px</span></label>
                            <input type="range" id="slider-sandbox-segment" min="10" max="100" step="1" value="10">
                        </div>

                        <div class="setting-item">
                            <label>Node Mass: <span id="val-sandbox-mass">0.2</span></label>
                            <input type="range" id="slider-sandbox-mass" min="0.05" max="2.0" step="0.05" value="0.2">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- Physics Core -->
    <script src="js/physics/Vector2.js"></script>
    <script src="js/physics/VerletNode.js"></script>
    <script src="js/physics/DistanceConstraint.js"></script>
    <script src="js/physics/CollisionResolver.js"></script>
    <script src="js/physics/VerletEngine.js"></script>

    <!-- Rendering -->
    <script src="js/rendering/RopeRenderer.js"></script>

    <!-- Core Game Logic -->
    <script src="js/core/WorldAnchor.js"></script>
    <script src="js/core/StructureBuilder.js"></script>
    <script src="js/core/LevelManager.js"></script>

    <!-- Main Entry -->
    <script src="js/main.js"></script>
</body>
</html>
