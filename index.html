<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constrained Construction</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <div id="canvas-wrapper">
            <canvas id="game-canvas"></canvas>

            <div id="message-overlay" class="hidden">
                <h2 id="overlay-title">Success</h2>
                <p id="overlay-text">Structure held successfully!</p>
            </div>
        </div>
        <div id="ui-layer">
            <div id="hud">
                <h1>Constrained Construction</h1>
                <div class="controls">
                    <div class="hud-buttons">
                        <div class="button-row">
                            <button id="btn-start" class="btn primary">Start</button>
                            <button id="btn-stop" class="btn danger">Stop & Reset</button>
                        </div>
                        <button id="btn-drop" class="full-width-btn">Drop Ball</button>
                        <button id="btn-start-game" class="btn primary full-width-btn" disabled>Start Scroll</button>
                        <button id="btn-reset-properties" class="btn-secondary full-width-btn">Reset Properties</button>
                        <button id="btn-save-settings" class="btn-dark-save full-width-btn">Save Settings</button>
                    </div>

                    <div class="physics-settings">
                        <h3 class="setting-title">Global Physics</h3>
                        <div class="setting-item">
                            <label>Rope Gravity: <span id="val-gravity">100%</span></label>
                            <input type="range" id="slider-gravity" min="0" max="10" step="0.01" value="1">
                        </div>
                        <div class="setting-item">
                            <label>Ball Gravity: <span id="val-ball-gravity">100%</span></label>
                            <input type="range" id="slider-ball-gravity" min="0" max="2" step="0.01" value="1">
                        </div>
                        <div class="setting-item">
                            <label>Engine Iterations: <span id="val-iterations">50</span></label>
                            <input type="range" id="slider-iterations" min="10" max="100" step="1" value="50">
                        </div>
                        <div class="setting-item">
                            <label>Air Resistance: <span id="val-drag">0.8%</span></label>
                            <input type="range" id="slider-drag" min="0" max="5" step="0.1" value="0.8">
                        </div>
                        <div class="setting-item">
                            <label>Launch X Velocity: <span id="val-vel-x">0.0</span></label>
                            <input type="range" id="slider-vel-x" min="-100" max="100" step="1" value="0">
                        </div>
                        <div class="setting-item">
                            <label>Launch Y Velocity: <span id="val-vel-y">0.0</span></label>
                            <input type="range" id="slider-vel-y" min="-100" max="100" step="1" value="0">
                        </div>
                        <div class="setting-item">
                            <label>Ball Mass: <span id="val-ball-mass">50</span></label>
                            <input type="range" id="slider-ball-mass" min="5" max="500" step="1" value="50">
                        </div>
                        <div class="setting-item">
                            <label>Scroll Speed: <span id="val-scroll-speed">1.0</span></label>
                            <input type="range" id="slider-scroll-speed" min="0" max="5" step="0.1" value="1.0">
                        </div>
                        <div class="setting-item divider-top">
                            <label>Live Velocity: <span id="live-velocity" class="label-cyan">0.00</span></label>
                        </div>
                        <div class="setting-item">
                            <label>Live Mass: <span id="live-mass" class="label-pink">50.0</span></label>
                        </div>
                        <div class="setting-item divider-top setting-row-layout">
                            <input type="checkbox" id="checkbox-endless" checked>
                            <label for="checkbox-endless" class="label-cyan">Endless Simulation</label>
                        </div>
                        <div class="setting-item divider-top setting-row-layout">
                            <input type="checkbox" id="checkbox-gravity-mode">
                            <label for="checkbox-gravity-mode" class="label-cyan">Gravity Control Mode</label>
                        </div>
                        <div class="setting-item" id="item-gravity-type" style="display: none;">
                            <label for="select-gravity-type">Gravity Type</label>
                            <select id="select-gravity-type" class="dropdown-select">
                                <option value="vector" selected>Global Vector (Directional)</option>
                                <option value="attractor">Point Attractor (Click Location)</option>
                            </select>
                        </div>
                    </div>

                    <div class="physics-settings" style="margin-top: 10px;">
                        <h3 class="setting-title">Sandbox Rope Properties</h3>

                        <div class="setting-item">
                            <label for="select-rope-type">Rope Type</label>
                            <select id="select-rope-type" class="dropdown-select">
                                <option value="twine">Twine (Weak, Saggy, Light)</option>
                                <option value="rope" selected>Standard Rope (Medium)</option>
                                <option value="steel">Steel Cable (Strong, Taut, Heavy)</option>
                            </select>
                        </div>

                        <div class="setting-item disabled" id="item-sandbox-strength">
                            <label>Breaking Strength (Disabled): <span id="val-sandbox-strength">Infinity</span></label>
                            <input type="range" id="slider-sandbox-strength" min="0.5" max="6.5" step="0.05" value="6.5"
                                disabled>
                        </div>

                        <div class="setting-item">
                            <label>Starting Sag: <span id="val-sandbox-tension">100%</span></label>
                            <input type="range" id="slider-sandbox-tension" min="0.94" max="1.15" step="0.01"
                                value="1.00">
                        </div>

                        <div class="setting-item">
                            <label>Impact Rigidity: <span id="val-sandbox-rigidity">50</span></label>
                            <input type="range" id="slider-sandbox-rigidity" min="0" max="500" step="1" value="300">
                        </div>

                        <div class="setting-item">
                            <label>Segment Length: <span id="val-sandbox-segment">5px</span></label>
                            <input type="range" id="slider-sandbox-segment" min="3" max="15" step="1" value="5">
                        </div>

                        <div class="setting-item">
                            <label>Node Mass: <span id="val-sandbox-mass">0.2</span></label>
                            <input type="range" id="slider-sandbox-mass" min="0.05" max="2.0" step="0.05" value="0.20">
                        </div>

                        <div class="setting-item">
                            <label>Max Bend Deflection (Degrees): <span
                                    id="val-sandbox-bendAngleLimit">90</span></label>
                            <input type="range" id="slider-sandbox-bendAngleLimit" min="0" max="180" step="1"
                                value="90">
                        </div>

                        <div class="setting-item">
                            <label>Bending Stiffness: <span id="val-sandbox-bendingStiffness">0.40</span></label>
                            <input type="range" id="slider-sandbox-bendingStiffness" min="0.00" max="5.00" step="0.05"
                                value="0.40">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- Main Entry -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
