<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constrained Construction</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <div id="canvas-wrapper">
            <canvas id="game-canvas"></canvas>

            <div id="message-overlay" class="hidden">
                <h2 id="overlay-title">Success</h2>
                <p id="overlay-text">Structure held successfully!</p>
            </div>
        </div>
        <div id="ui-layer">
            <div id="hud">
                <h1>Constrained Construction</h1>
                <div class="controls">
                    <div class="hud-buttons"
                        style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px;">
                        <div style="display: flex; gap: 10px;">
                            <button id="btn-start" class="btn primary" style="flex: 1;">Start</button>
                            <button id="btn-stop" class="btn danger" style="flex: 1;">Stop & Reset</button>
                        </div>
                        <button id="btn-drop" style="width: 100%;">Drop Ball</button>
                        <button id="btn-start-game" class="btn primary" style="width: 100%;" disabled>Start
                            Scroll</button>
                        <button id="btn-reset-properties"
                            style="width: 100%; font-size: 0.85rem; padding: 6px 12px; background-color: #233554; border: 1px solid #64ffda; color: #64ffda;">Reset
                            Properties</button>
                        <button id="btn-save-settings"
                            style="width: 100%; font-size: 0.85rem; padding: 6px 12px; background-color: #112240; border: 1px solid #64ffda; color: #64ffda; margin-top: 4px;">Save
                            Settings</button>
                    </div>

                    <div class="physics-settings">
                        <h3
                            style="font-size: 0.9rem; color: #64ffda; margin-bottom: 5px; border-bottom: 1px solid #3a4b66; padding-bottom: 3px; text-transform: uppercase;">
                            Global Physics</h3>
                        <div class="setting-item">
                            <label>Rope Gravity: <span id="val-gravity">100%</span></label>
                            <input type="range" id="slider-gravity" min="0" max="10" step="0.01" value="1">
                        </div>
                        <div class="setting-item">
                            <label>Ball Gravity: <span id="val-ball-gravity">100%</span></label>
                            <input type="range" id="slider-ball-gravity" min="0" max="2" step="0.01" value="1">
                        </div>
                        <div class="setting-item">
                            <label>Engine Iterations: <span id="val-iterations">50</span></label>
                            <input type="range" id="slider-iterations" min="10" max="100" step="1" value="50">
                        </div>
                        <div class="setting-item">
                            <label>Air Resistance: <span id="val-drag">0.8%</span></label>
                            <input type="range" id="slider-drag" min="0" max="5" step="0.1" value="0.8">
                        </div>
                        <div class="setting-item">
                            <label>Launch X Velocity: <span id="val-vel-x">0.0</span></label>
                            <input type="range" id="slider-vel-x" min="-100" max="100" step="1" value="0">
                        </div>
                        <div class="setting-item">
                            <label>Launch Y Velocity: <span id="val-vel-y">0.0</span></label>
                            <input type="range" id="slider-vel-y" min="-100" max="100" step="1" value="0">
                        </div>
                        <div class="setting-item">
                            <label>Ball Mass: <span id="val-ball-mass">50</span></label>
                            <input type="range" id="slider-ball-mass" min="5" max="500" step="1" value="50">
                        </div>
                        <div class="setting-item">
                            <label>Scroll Speed: <span id="val-scroll-speed">1.0</span></label>
                            <input type="range" id="slider-scroll-speed" min="0" max="5" step="0.1" value="1.0">
                        </div>
                        <div class="setting-item" style="border-top: 1px solid #3a4b66; padding-top: 5px;">
                            <label>Live Velocity: <span id="live-velocity" style="color: #64ffda;">0.00</span></label>
                        </div>
                        <div class="setting-item">
                            <label>Live Mass: <span id="live-mass" style="color: #ff3366;">50.0</span></label>
                        </div>
                        <div class="setting-item"
                            style="flex-direction: row; justify-content: flex-start; align-items: center; gap: 8px; border-top: 1px solid #3a4b66; padding-top: 5px;">
                            <input type="checkbox" id="checkbox-endless"
                                style="cursor: pointer; width: auto; margin: 0;" checked>
                            <label for="checkbox-endless"
                                style="margin: 0; cursor: pointer; display: inline; color: #64ffda; font-weight: bold;">Endless
                                Simulation</label>
                        </div>
                        <div class="setting-item"
                            style="flex-direction: row; justify-content: flex-start; align-items: center; gap: 8px; border-top: 1px solid #3a4b66; padding-top: 5px;">
                            <input type="checkbox" id="checkbox-gravity-mode"
                                style="cursor: pointer; width: auto; margin: 0;">
                            <label for="checkbox-gravity-mode"
                                style="margin: 0; cursor: pointer; display: inline; color: #64ffda; font-weight: bold;">Gravity
                                Control Mode</label>
                        </div>
                        <div class="setting-item" id="item-gravity-type" style="display: none;">
                            <label for="select-gravity-type">Gravity Type</label>
                            <select id="select-gravity-type"
                                style="width: 100%; background-color: #112240; color: #ccd6f6; border: 1px solid #3a4b66; padding: 6px; border-radius: 4px; font-family: inherit; cursor: pointer;">
                                <option value="vector" selected>Global Vector (Directional)</option>
                                <option value="attractor">Point Attractor (Click Location)</option>
                            </select>
                        </div>
                    </div>

                    <div class="physics-settings" style="margin-top: 10px;">
                        <h3
                            style="font-size: 0.9rem; color: #64ffda; margin-bottom: 5px; border-bottom: 1px solid #3a4b66; padding-bottom: 3px; text-transform: uppercase;">
                            Sandbox Rope Properties</h3>

                        <div class="setting-item">
                            <label for="select-rope-type">Rope Type</label>
                            <select id="select-rope-type"
                                style="width: 100%; background-color: #112240; color: #ccd6f6; border: 1px solid #3a4b66; padding: 6px; border-radius: 4px; font-family: inherit; cursor: pointer;">
                                <option value="twine">Twine (Weak, Saggy, Light)</option>
                                <option value="rope" selected>Standard Rope (Medium)</option>
                                <option value="steel">Steel Cable (Strong, Taut, Heavy)</option>
                            </select>
                        </div>

                        <div class="setting-item disabled" id="item-sandbox-strength">
                            <label>Breaking Strength (Disabled): <span id="val-sandbox-strength">Infinity</span></label>
                            <input type="range" id="slider-sandbox-strength" min="0.5" max="6.5" step="0.05" value="6.5"
                                disabled>
                        </div>

                        <div class="setting-item">
                            <label>Starting Sag: <span id="val-sandbox-tension">100%</span></label>
                            <input type="range" id="slider-sandbox-tension" min="0.94" max="1.15" step="0.01"
                                value="1.00">
                        </div>

                        <div class="setting-item">
                            <label>Impact Rigidity: <span id="val-sandbox-rigidity">50</span></label>
                            <input type="range" id="slider-sandbox-rigidity" min="0" max="500" step="1" value="300">
                        </div>

                        <div class="setting-item">
                            <label>Segment Length: <span id="val-sandbox-segment">5px</span></label>
                            <input type="range" id="slider-sandbox-segment" min="3" max="15" step="1" value="5">
                        </div>

                        <div class="setting-item">
                            <label>Node Mass: <span id="val-sandbox-mass">0.2</span></label>
                            <input type="range" id="slider-sandbox-mass" min="0.05" max="2.0" step="0.05" value="0.20">
                        </div>

                        <div class="setting-item">
                            <label>Max Bend Deflection (Degrees): <span
                                    id="val-sandbox-bendAngleLimit">90</span></label>
                            <input type="range" id="slider-sandbox-bendAngleLimit" min="0" max="180" step="1"
                                value="90">
                        </div>

                        <div class="setting-item">
                            <label>Bending Stiffness: <span id="val-sandbox-bendingStiffness">0.40</span></label>
                            <input type="range" id="slider-sandbox-bendingStiffness" min="0.00" max="5.00" step="0.05"
                                value="0.40">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- Physics Core -->
    <script src="js/physics/Vector2.js?v=17"></script>
    <script src="js/physics/VerletNode.js?v=17"></script>
    <script src="js/physics/DistanceConstraint.js?v=17"></script>
    <script src="js/physics/BendingConstraint.js?v=17"></script>
    <script src="js/physics/CollisionResolver.js?v=17"></script>
    <script src="js/physics/VerletEngine.js?v=17"></script>

    <!-- Rendering -->
    <script src="js/rendering/RopeRenderer.js?v=17"></script>

    <!-- Core Game Logic -->
    <script src="js/core/WorldAnchor.js?v=17"></script>
    <script src="js/core/StructureBuilder.js?v=17"></script>
    <script src="js/core/LevelManager.js?v=17"></script>

    <!-- Main Entry -->
    <script src="js/main.js?v=17"></script>
</body>

</html>
